baseURL = 'https://gitorko.github.io/'
locale = 'en-us'
title = 'GitOrko'
copyright = ""

theme = ["hugo-clarity", "hugo-notice"]
enableRobotsTXT = true

enableEmoji = true

DefaultContentLanguage = "en"

[pagination]
pagerSize = 10

[mediaTypes."application/javascript"]
suffixes = ["ts","js","jsm","mjs"]

[taxonomies]
category = "categories"
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]
